- type: entity
  parent:
  - AppearanceFelikin
  - BaseSpeciesMobOrganic
  id: MobFelikin
  name: Urist McHands the Catboy
  components:
  - type: Fixtures
    fixtures: # TODO: This needs a second fixture just for mob collisions.
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 105
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Damageable
    damageModifierSet: Felikin
  - type: Speech
    speechVerb: Wawa
    speechSounds: Cat
    allowedEmotes: ['Chitter','CatMeow','CatHisses'] 
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 2
        Blunt: 3
        
