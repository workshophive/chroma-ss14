- type: entity
  parent:
  - BaseMobSpeciesOrganic
  - AppearanceSekkan
  id: MobSekkan
  name: Urist McSeki
  components:
  - type: JumpAbility
    action: ActionVulpkaninGravityJump
    canCollide: true
    jumpDistance: 1.5
    jumpSound:
      path: /Audio/Weapons/punchmiss.ogg
      params:
        pitch: 1.33
        volume: -5
        variation: 0.05

