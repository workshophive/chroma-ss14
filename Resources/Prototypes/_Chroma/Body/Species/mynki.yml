- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceMynki
  categories: [HideSpawnMenu]
  name: mynki appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganMynkiTorso
      Head: OrganMynkiHead
      ArmLeft: OrganMynkiArmLeft
      ArmRight: OrganMynkiArmRight
      HandRight: OrganMynkiHandRight
      HandLeft: OrganMynkiHandLeft
      LegLeft: OrganMynkiLegLeft
      LegRight: OrganMynkiLegRight
      FootLeft: OrganMynkiFootLeft
      FootRight: OrganMynkiFootRight
      Brain: OrganMynkiBrain
      Eyes: OrganMynkiEyes
      Tongue: OrganMynkiTongue
      Appendix: OrganMynkiAppendix
      Ears: OrganMynkiEars
      Lungs: OrganMynkiLungs
      Heart: OrganMynkiHeart
      Stomach: OrganMynkiStomach
      Liver: OrganMynkiLiver
      Kidneys: OrganMynkiKidneys
  - type: HumanoidProfile
    species: Mynki
    
- type: entity
  parent:
  - AppearanceMynki
  - BaseSpeciesMobOrganic
  id: MobMynki
  name: Urist McTsavua
  components:
  - type: Damageable
    damageModifierSet: Mynki
  - type: Speech
    speechVerb: Mynki
    speechSounds: Mynki
  - type: TypingIndicator
    proto: moth # To do - make mynki one
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: ElectrumBlood
        Quantity: 600
  - type: Vocal
    emoteSounds: UnisexMynki
  - type: TemperatureDamage # Mynki can tolerate heat and cold equally; however, they burn easier still!
    heatDamageThreshold: 321.15
    coldDamageThreshold: 230
    coldDamage:
      types:
        Cold: 0.5
    heatDamage:
      types:
        Heat: 1
  - type: Flammable
    damage:
      types:
        Heat: 2 # Burn easier because of the whole. Cloth thing.
  - type: PassiveDamage
    # Lets mynki tank some cellular damage, as well as passively healing caustic damage due to them taking more
    # Maybe let them heal structural damage as well when it's implemented?
    intervalHaltOnDamageTaken: 5s
    allowedStates:
    - Alive
    damage:
      types:
        Heat: -0.07
        Caustic: -0.06
        Blunt: -0.05
        Piercing: -0.05
        Slash: -0.05
        Cellular: -0.2
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 15
    animation: WeaponArcClaw
    damage:
      types:
        Piercing: 2
        Structural: 0.5

