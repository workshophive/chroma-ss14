- type: entity
  parent: AppearanceHuman
  id: AppearanceDragonborn
  categories: [HideSpawnMenu]
  name: dragonborn appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganDragonbornTorso
      Head: OrganDragonbornHead
      ArmLeft: OrganDragonbornArmLeft
      ArmRight: OrganDragonbornArmRight
      HandRight: OrganDragonbornHandRight
      HandLeft: OrganDragonbornHandLeft
      LegLeft: OrganDragonbornLegLeft
      LegRight: OrganDragonbornLegRight
      FootLeft: OrganDragonbornFootLeft
      FootRight: OrganDragonbornFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganReptilianTongue
      Appendix: OrganReptilianAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganReptilianStomach
      Liver: OrganReptilianLiver
      Kidneys: OrganReptilianKidneys
  - type: HumanoidProfile
    species: Dragonborn
    
- type: entity
  parent: 
  - AppearanceDragonborn
  - BaseSpeciesMobOrganic
  id: MobDragonborn
  name: Urist McHands the Scalie
  components:
  - type: Speech
    speechSounds: Lizard
    speechVerb: Reptilian
    allowedEmotes: ['Thump']
  - type: Vocal
    emoteSounds: MaleReptilian
  - type: BodyEmotes
    soundsId: ReptilianBodyEmotes
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 2
        Blunt: 3
        
- type: entity
  parent: OrganHumanExternal
  id: OrganDragonbornExternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Dragonborn
      
- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganDragonbornExternal ]
  id: OrganDragonbornTorso

- type: entity
